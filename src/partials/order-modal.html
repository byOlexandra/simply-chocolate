<div class="order-backdrop">
  <div class="order">
    <button
      type="button"
      class="order__close-btn"
      id="closeOrderModal"
      aria-label="Close modal window"
    >
      &times;
    </button>
    <h2 class="order__title">Order Your Sweet Treat</h2>
    <p class="order__subtitle">
      Select your favorite chocolate and fill in the details
    </p>

    <form class="order__form" id="orderForm">
      <div class="order__selection-container">
        <p class="order__section-label">1. Choose Chocolate:</p>

        <div class="order__choc-list" id="modalChocolateList"></div>

        <input
          type="hidden"
          name="selected_chocolate"
          id="selectedChocInput"
          autocomplete="off"
        />
      </div>

      <div class="order__fields-container">
        <p class="order__section-label">2. Delivery Info:</p>

        <div class="order__input-box">
          <div class="order__form-group">
            <label class="order__label" for="userName">Full Name</label>
            <input
              class="order__input"
              type="text"
              id="userName"
              name="customer_name"
              placeholder="Enter your name"
              autocomplete="name"
              autofocus
            />
            <span class="order__error-message" id="error-customer_name"></span>
          </div>
          <div class="order__form-group">
            <label class="order__label" for="userPhone">Phone Number</label>
            <input
              class="order__input"
              type="tel"
              id="userPhone"
              name="customer_phone"
              autocomplete="tel"
            />
            <span class="order__error-message" id="error-customer_phone"></span>
          </div>
          <div class="order__form-group">
            <label class="order__label" for="userEmail"
              >Email <span class="optional-span">(optional)</span></label
            >
            <input
              class="order__input"
              type="email"
              id="userEmail"
              name="customer_email"
              autocomplete="email"
            />
          </div>
          <div class="order__form-group">
            <label class="order__label" for="userCity">City</label>
            <input
              class="order__input"
              type="text"
              id="userCity"
              name="customer_city"
              placeholder="e.g. Kyiv"
              autocomplete="address-level2"
            />
            <span class="order__error-message" id="error-customer_city"></span>
          </div>
          <div class="order__form-group">
            <label class="order__label" for="deliveryMethod"
              >Delivery Method</label
            >
            <select
              class="order__input"
              id="deliveryMethod"
              name="delivery_method"
            >
              <option value="" disabled selected>Select method</option>
              <option value="nova_poshta">Nova Post</option>
              <option value="courier">Courier Delivery</option>
              <option value="pickup">Self-pickup</option>
            </select>
            <span
              class="order__error-message"
              id="error-delivery_method"
            ></span>
          </div>
          <div id="dynamic-fields-container"></div>
          <div class="order__form-group">
            <label class="order__label" for="userComment"
              >Comment <span class="optional-span">(optional)</span></label
            >
            <textarea
              class="order__textarea"
              id="userComment"
              name="customer_comment"
              placeholder="Any special requests?"
              rows="2"
            ></textarea>
          </div>
        </div>
        <div class="order__checkbox-group">
          <input
            class="order__checkbox"
            type="checkbox"
            id="isGift"
            name="is_gift"
          />
          <label class="order__label-checkbox" for="isGift"
            >It's a gift (add special packaging)</label
          >
        </div>
      </div>

      <button type="submit" class="order__submit-btn">Confirm</button>
    </form>
  </div>
</div>
