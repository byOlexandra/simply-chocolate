<div class="review-backdrop">
  <div class="review-modal">
    <button type="button" class="review-modal__close-btn" id="closeModal">
      &times;
    </button>
    <h2 class="review-modal__title">
      Leave a review <br class="is-mobile" />
      about <span class="highlight">our chocolate</span>
    </h2>

    <form class="review-modal__form">
      <div class="review-modal__form-field">
        <label for="username" class="review-modal__form-label">Name</label>
        <div class="review-modal__input-wrapper">
          <input
            type="text"
            name="username"
            id="username"
            class="review-modal__input"
            autocomplete="name"
          />
          <svg class="review-modal__input-icon" width="17" height="17">
            <use href="/img/sprite.svg#icon-user"></use>
          </svg>
        </div>
        <span id="error-username" class="review-modal__error-message"></span>
      </div>
      <div class="review-modal__form-field">
        <label for="email" class="review-modal__form-label">Email</label>
        <div class="review-modal__input-wrapper">
          <input
            type="email"
            name="email"
            id="email"
            class="review-modal__input"
            autocomplete="email"
          />
        <svg class="review-modal__input-icon" width="17" height="17">
            <use href="/img/sprite.svg#icon-mail"></use>
        </svg>
        </div>
        <span id="error-email" class="review-modal__error-message"></span>
      </div>
      <div class="review-modal__form-field">
        <label for="phone" class="review-modal__form-label">Phone</label>
        <div class="review-modal__input-wrapper">
          <input
            type="tel"
            name="phone"
            id="phone"
            class="review-modal__input"
            autocomplete="tel"
          />
        <svg class="review-modal__input-icon" width="17" height="17">
            <use href="/img/sprite.svg#icon-phone"></use>
        </svg>
        </div>
        <span id="error-phone" class="review-modal__error-message"></span>
      </div>
      <div class="review-modal__form-field">
        <label for="comment" class="review-modal__form-label">Comment</label>
        <textarea
          name="comment"
          id="comment"
          placeholder="Enter text"
          rows="3"
          class="review-modal__textarea"
        ></textarea>
        <span id="error-comment" class="review-modal__error-message"></span>
      </div>
      <div class="review-modal__checkbox-group">
        <input
          type="checkbox"
          name="terms"
          id="terms"
          class="review-modal__checkbox"
        />
        <label for="terms" class="review-modal__checkbox-label"
          >I accept the terms and conditions of the
          <span class="review-modal__terms-span highlight">Privacy Policy</span>
        </label>
        </div>
        <span id="error-terms" class="review-modal__error-message"></span>
      

      <button type="submit" class="review-modal__submit-btn">Send</button>
    </form>
  </div>
</div>
